services:
  - type: web
    name: zerkalo-server
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker app:app
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: TRUST_WALLET
        sync: false
      - key: FOUNDER_ID
        sync: false
      - key: HEIR_ID
        sync: false

  - type: web
    name: zerkalo-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: FOUNDER_ID
        sync: false
      - key: HEIR_ID
        sync: false
